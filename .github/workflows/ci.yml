name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db-tests:
    # AGENTS.md Section 10: RLS and permission tests are release-blocking.
    # This spins up the same local Supabase stack used in dev (Docker is
    # preinstalled on GitHub-hosted runners), applies every migration, and
    # runs the pgTAP suite against it — catching exactly the kind of RLS
    # regression that previously only surfaced through manual local testing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Supabase CLI is a pnpm devDependency (see package.json); this
      # resolves and caches its platform binary without a separate action.
      - run: pnpm exec supabase --version

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Apply migrations + seed
        run: pnpm exec supabase db reset

      - name: Run pgTAP tests
        run: pnpm exec supabase test db

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop
